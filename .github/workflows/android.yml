name: Build Megatronic APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Android JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Pure Android Command Line Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p android-sdk/cmdline-tools
          wget -q https://google.com -O cmdline.zip
          unzip -q cmdline.zip -d temp_tools
          mv temp_tools/cmdline-tools android-sdk/cmdline-tools/latest
          rm -rf cmdline.zip temp_tools
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk

      - name: Download SDK Platforms and Build Tools
        run: |
          export ANDROID_HOME=${{ github.workspace }}/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Dynamic Global Gradle Runtime
        run: |
          wget -q https://gradle.org
          sudo unzip -q gradle-8.7-bin.zip -d /opt/
          sudo ln -s /opt/gradle-8.7/bin/gradle /usr/bin/gradle
          rm -f gradle-8.7-bin.zip

      - name: Compile and Build APK Debug Package
        run: |
          export ANDROID_HOME=${{ github.workspace }}/android-sdk
          gradle assembleDebug --no-daemon

      - name: Upload Finished Megatronic APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: megatronic-hud-release-apk
          path: app/build/outputs/apk/debug/*.apk
