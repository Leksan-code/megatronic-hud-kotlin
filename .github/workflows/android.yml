name: Build Megatronic APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Android JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Официальное и надежное действие, которое развернет Android SDK без скачивания битых архивов
      - name: Setup Android SDK Tools Automatically
        uses: android-actions/setup-android@v3

      - name: Install Platforms and Build Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Dynamic Global Gradle Runtime
        run: |
          sudo apt-get update && sudo apt-get install -y wget unzip
          wget -q https://gradle.org
          sudo unzip -q gradle-8.7-bin.zip -d /opt/
          sudo ln -sf /opt/gradle-8.7/bin/gradle /usr/bin/gradle
          rm -f gradle-8.7-bin.zip

      - name: Compile and Build APK Debug Package
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload Finished Megatronic APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: megatronic-hud-release-apk
          path: app/build/outputs/apk/debug/*.apk
