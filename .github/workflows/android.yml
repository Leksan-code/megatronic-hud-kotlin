name: Build Megatronic APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Android JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          # Отключаем встроенное кэширование, чтобы обойти сбой серверов GitHub
          cache: ''

      # Настройка Gradle напрямую без лишних плагинов кэша
      - name: Setup Dynamic Gradle Runtime
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true

      # Запуск чистой компиляции
      - name: Compile and Build APK Debug Package
        run: |
          gradle assembleDebug --no-daemon -Pandroid.builder.sdkDownload=true
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk

      - name: Upload Finished Megatronic APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: megatronic-hud-release-apk
          path: app/build/outputs/apk/debug/*.apk
